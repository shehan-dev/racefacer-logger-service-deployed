openapi: 3.0.3
info:
  title: Kart Timing Tracker - Python REST API
  description: >-
    This API allows controlling and monitoring the kart lap logger and scraper through HTTP endpoints.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
  - url: http://localhost:5000/rs
paths:
  /:
    get:
      summary: Health check
      description: Check if the Flask server is running
      operationId: GetHealth
      responses:
        "200":
          description: Server is running
  /start-matrix-logger:
    post:
      summary: Start matrix logger
      operationId: StartMatrixLogger
      responses:
        "200":
          description: Matrix logger started
        "400":
          description: Logger already running
        "500":
          description: Server error
  /start-scraper:
    post:
      summary: Start kart timing scraper
      operationId: StartScraper
      responses:
        "200":
          description: Scraper started
        "400":
          description: Scraper already running
        "500":
          description: Server error
  /stop-scraper:
    post:
      summary: Stop kart timing scraper
      operationId: StopScraper
      responses:
        "200":
          description: Scraper stopped
        "400":
          description: No scraper running
components: {}
